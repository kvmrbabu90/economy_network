[project]
name = "econgraph"
version = "0.1.0"
description = "A single, queryable, directed, typed graph of the economy."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# research/dominoes (the pre-registered domino study); its tests are skipped when these are missing
research = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["schema*", "pipeline*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
