[project]
name = "econgraph"
version = "0.1.0"
description = "A single, queryable, directed, typed graph of the economy."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["schema*", "pipeline*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
