# Phase D — Country-default retail markets
#
# Maps ISO-3166-1 alpha-2 country code → the ordered list of consumer-market
# region IDs that companies from that country *primarily* serve.
#
# Design decisions:
#   - This list is ADDITIVE to the industry_to_retail list, not a replacement.
#     commodities.py takes the UNION of (industry base markets) and (country
#     default markets), capped by the industry base list. If Samsung Electronics
#     (KR) is in "Consumer Electronics" whose base markets are
#     [us, eu, china, india, japan, brazil, southeast-asia], the final list
#     becomes [us, eu, china, japan, southeast-asia, korea, india] (brazil
#     dropped because KR defaults don't include it; korea added because it does).
#
#   - US companies are EXCLUDED from this file. They use industry_to_retail
#     unchanged (backward-compatible).
#
#   - When a company's country code is not in this map, fall back to the
#     industry_to_retail list unchanged (same as current behavior).
#
# Region IDs reference config/retail_markets.yaml.
# Ordering is largest-revenue-exposure first.

# --- East Asia ---
JP:   # Japan — strong domestic + US/EU/Asia exports
  primary:
    - region:japan-consumer
    - region:us-consumer
    - region:eu-consumer
    - region:china-consumer
    - region:southeast-asia-consumer
    - region:korea-consumer

KR:   # Korea — Samsung, SK Hynix, LG, Hyundai: Asia-first then global
  primary:
    - region:korea-consumer
    - region:china-consumer
    - region:us-consumer
    - region:eu-consumer
    - region:japan-consumer
    - region:southeast-asia-consumer

CN:   # China — strong domestic; selective international
  primary:
    - region:china-consumer
    - region:us-consumer
    - region:eu-consumer
    - region:southeast-asia-consumer
    - region:japan-consumer

TW:   # Taiwan — TSMC, Foxconn: B2B-heavy but consumer electronics end-market
  primary:
    - region:china-consumer
    - region:us-consumer
    - region:eu-consumer
    - region:japan-consumer
    - region:southeast-asia-consumer
    - region:korea-consumer

