# GICS sub-industry -> commodities used (supplies edges).
#
# Semantics: each entry means "every S&P 500 filer in this sub-industry
# is treated as a consumer of the listed commodities."  An edge
#       commodity:X --supplies--> cik:Y
# is generated per (commodity, filer) pair.
#
# This is intentionally a *coarse* map -- one row per industry, not per
# company. Companies that are themselves commodity *producers* will end
# up with a self-loop (commodity:crude-oil -> exxon, because exxon's
# industry is Integrated Oil & Gas which consumes crude oil to refine).
# That's fine; the graph then shows ExxonMobil sitting next to its
# producer commodity rather than as a downstream consumer alone.
#
# Format: each top-level key is the sub-industry name (must match the
# value in data/companies.jsonl's `sub_industry` field exactly).

# ------------------------------------------------------------------
# ENERGY
# ------------------------------------------------------------------
Integrated Oil & Gas: [crude-oil, natural-gas, sulfur, hydrogen]
Oil & Gas Exploration & Production: [crude-oil, natural-gas, silica-sand]
Oil & Gas Refining & Marketing: [crude-oil, ethylene, propylene, sulfur, hydrogen]
Oil & Gas Storage & Transportation: [crude-oil, natural-gas]
Oil & Gas Equipment & Services: [steel, silica-sand]

