# GICS sub-industry -> retail consumer markets served.
#
# Semantics: each entry means "every S&P 500 filer in this sub-industry
# has the public as a customer in the listed markets." An edge
#       cik:Y --supplies--> region:X-consumer
# is generated per (filer, market) pair, surfaced in the UI as a
# customer_of relationship (region X-consumer is the customer of Y).
#
# Defaults: every B2C-facing industry gets US, EU, China at minimum
# (the three biggest consumer blocs). Industries that explicitly target
# additional markets (e.g. India for Apple, Brazil for McDonald's)
# can be expanded later via per-company overrides.
#
# Industries with no entry (or empty list) are treated as B2B and
# don't generate retail-consumer edges.

# ------------------------------------------------------------------
# DIRECT RETAIL (storefronts, e-commerce)
# ------------------------------------------------------------------
Consumer Staples Merchandise Retail: [us, eu, china, india, japan, brazil, southeast-asia]
