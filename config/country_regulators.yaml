# country_regulators.yaml — per-country regulatory body assignments
#
# Used by pipeline/regulators.py for country-aware regulated_by routing:
#   * wikidata: (non-SEC-filer) companies: country regulators replace the
#     US _default (SEC) from regulators.yaml. Sector/industry US rules still
#     apply only if explicitly overridden here.
#   * cik: companies with non-US country code: country regulators are ADDED
#     on top of whatever regulators.yaml already assigns.
#
# Verification targets (Phase C acceptance):
#   Toyota  (JP, Automobile Manufacturers) → jp-fsa, jp-meti
#   Shell   (GB, Integrated Oil & Gas)     → gb-fca
#   ASML    (NL, Semiconductors)           → nl-afm, esma
#
# ID format: regulator:<slug>
# Prefer well-known abbreviations where unambiguous globally.
# Include national prefix only where disambiguation is needed.
#
# Each country entry is a list of regulator specs that apply to ALL companies
# headquartered there regardless of sub-industry. Industry-specific additions
# use the optional `industry` sub-key within a country block.

# ─────────────────────────────────────────────────────────────────────────────
# Asia-Pacific
# ─────────────────────────────────────────────────────────────────────────────
JP:  # Japan
  _all:
    - id: regulator:jp-fsa
      name: Financial Services Agency (FSA), Japan
      scope: Banks, securities firms, and insurance supervision
    - id: regulator:jp-meti
      name: Ministry of Economy, Trade and Industry (METI), Japan
      scope: Industrial policy, trade, energy, and export controls

