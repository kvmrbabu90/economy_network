# Curated catalog of ~100 major raw materials.
#
# Each entry has:
#   id              -- canonical commodity id  (commodity:<slug>)
#   name            -- human-readable label
#   category        -- fuels | metals | minerals | agriculture | softs | timber | plastics
#   aliases         -- alternate names (alias-table seed)
#   top_producer    -- country name of the world's #1 producer (or US state if US is #1)
#   top_producer_country_code -- ISO-3166-1 alpha-2 (US, CN, SA, ...) for grouping
#   us_state        -- US state postal code if the US is the top producer (else null)
#   lat, lon        -- placement on the globe (country centroid or US-state centroid)
#   unit            -- typical unit (barrels, tonnes, bushels, oz, ...)
#   source          -- citation for the producer rank
#
# Sources:
#   USGS Mineral Commodity Summaries 2024
#   EIA International Energy Statistics 2023
#   USDA Foreign Agricultural Service 2023
#   FAOSTAT 2023
#   World Steel Association 2023
#   International Lead and Zinc Study Group 2023

