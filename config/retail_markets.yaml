# Retail consumer markets -- regional sink nodes representing the
# B2C end of the value chain. Companies that sell to the public have
# customer_of edges pointing at the relevant market(s).
#
# Each entry:
#   id            -- canonical id (region:<slug>)
#   name          -- human-readable label
#   region_code   -- ISO-3166-1 alpha-2 or supranational code
#   lat, lon      -- centroid of the market (used by the globe view)
#   population_m  -- approximate consumer base in millions (for sizing)

