# gics_subindustry_to_industry.yaml -- GICS Sub-Industry -> GICS Industry rollup.
#
# Why this file exists (Phase 2 gotcha #1):
#
# Wikipedia's S&P 500 table ships "GICS Sub-Industry" values, which Phase 1
# stores on each Company node's `industry` field. But config/regulators.yaml
# is keyed on "GICS Industry" names. Without this map, the industry-level
# regulator join silently misses everything.
#
# Phase 7 widened this from the 11 Consumer Staples sub-industries to all
# 127 sub-industries present in the current S&P 500 (across 11 GICS sectors).
# The loader still raises on an unmapped sub-industry by design.

