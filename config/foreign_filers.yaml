# Phase A roster -- top global companies that file Form 20-F with the
# SEC (i.e. have a US ADR listing). Each entry mirrors the columns the
# S&P 500 pipeline uses so the downstream code can treat them uniformly.
#
# Required fields per entry:
#   cik          -- 10-digit zero-padded SEC CIK
#   name         -- canonical company name (matches Wikidata / Wikipedia)
#   ticker       -- primary US ADR ticker
#   country_code -- ISO 3166-1 alpha-2 of the company's home jurisdiction
#   gics_sector
#   gics_sub_industry  -- must exist in config/gics_subindustry_to_industry.yaml
#
# Curated 2026-05 from EDGAR's known foreign-private-issuer roster +
# personal knowledge of major ADR programmes. CIKs cross-checked against
# https://www.sec.gov/cgi-bin/browse-edgar lookups where unfamiliar.

