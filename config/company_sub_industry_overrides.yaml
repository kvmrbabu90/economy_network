# Company-level sub-industry overrides for retail-market routing.
#
# Problem: Wikidata Phase B companies are tagged "Industrial Conglomerates"
# in Wikidata when their real GICS sub-industry is not available. This prevents
# commodities.py from generating retail-market edges for major consumer-facing
# non-US companies like Samsung Electronics.
#
# Solution: this file maps specific canonical company IDs to the GICS
# sub-industry they *should* have for the purposes of retail-market routing.
# The sub-industry value must match a key in config/industry_to_retail.yaml.
#
# Format:
#   "canonical-id": "GICS Sub-Industry Name"
#
# These overrides are applied before the industry_to_retail lookup in
# pipeline/commodities.py. They do NOT change the company's stored industry
# field in companies.jsonl — they are routing-only overrides.
#
# Maintenance: add entries here when a Wikidata company is misclassified and
# has a meaningful B2C consumer presence. Do not add B2B-only companies.

# ── East Asia ─────────────────────────────────────────────────────────────────

# Samsung Electronics (KR) — world's largest consumer electronics company
"wikidata:Q20718": "Consumer Electronics"

# ASUS (TW) — PC / laptop / phone maker
"wikidata:Q152864": "Technology Hardware, Storage & Peripherals"

# Wistron (TW) — OEM manufacturer; end-consumer markets via brand customers
